name: IndexNow 推送

# 内容改动上线后把 URL 推给 Bing（IndexNow），ChatGPT 搜索部分依赖 Bing 索引。
# cron 任务用 GITHUB_TOKEN 推的提交不会触发 push 事件，所以另挂 workflow_run。
on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"
      - "src/content/news/**"
      - "src/content/opus-prompts/cases.json"
      - "src/content/image-prompts/**"
      - "src/content/gemini-prompts/**"
      - "public/data/opus-prompts/**"
      - "public/data/image-prompts/**"
      - "public/data/gemini-prompts/**"
      - "src/generated/ai-visibility-leaderboard.json"
      - "src/lib/guides/**"
      - "src/lib/go-global*.ts"
      - "src/app/[lang]/research/**"
      - "src/app/[lang]/go-global/**"
      - "src/app/[lang]/tools/**"
      - "src/app/[lang]/contact/**"
      - "src/app/[lang]/services/**"
      - "src/app/[lang]/about/**"
      - "src/app/[lang]/handbook/**"
      - "src/app/[lang]/ai-learning-guide/**"
      - "src/app/[lang]/backlink-spam-list/**"
      - "src/app/[lang]/club/page.tsx"
      - "src/app/[lang]/prompts/claude-animation/**"
  workflow_run:
    # 注意：GitHub workflow_run 按中文/全角括号工作流名匹配不可靠（2026-11-06 起提示词库每日收录从未触发过本工作流，导致 Bing 报 IndexNow 红警告）。
    # 因此 opus-prompts-daily.yml / seller-weekly.yml / translate-content.yml 改为 push 后直接调 scripts/indexnow.mjs；
    # 这里保留纯 ASCII 名称的 Daily AI News Digest 作为兜底。
    workflows: ["Daily AI News Digest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      range:
        description: "git range（留空 = HEAD~1..HEAD）"
        required: false
        default: ""

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 推送改动的 URL
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RANGE: ${{ github.event.inputs.range }}
        run: |
          case "$EVENT" in
            push)
              # 新分支首推时 before 是全 0
              if [[ "$BEFORE" =~ ^0+$ ]]; then RANGE="HEAD~1..$AFTER"; else RANGE="$BEFORE..$AFTER"; fi ;;
            workflow_run) RANGE="$RUN_SHA..HEAD" ;;
            *) RANGE="${INPUT_RANGE:-HEAD~1..HEAD}" ;;
          esac
          echo "range: $RANGE"
          node scripts/indexnow.mjs "$RANGE"
