# GEO 引用面板：每周一把固定的题库问一遍几家 AI，记下它们有没有引用、点名 jasonzhu.ai，和上周、和 11-17 的基线比。
#
#   提问  ops/geo/panel_run.py 调 backlink-guard 的 asked（AIsa 接口，AISA_API_KEY）。平时问 ChatGPT、Gemini App、
#         Google AI Mode、Perplexity，每题各 3 次；每月第一个周一加问 Claude 1 次（一个回答约 $0.045，是别家的 10 倍）。
#         题库是冻结组 21 题、真实问法组 30 题、Search Console 真题组 17 题、收款格子组 36 题（后两组 2026-11-30 起），
#         一次约 $5.7（11-23 实测每个回答约 $0.0046）。加 Claude 要约 $10.4–11.1，超过 max_usd：按题库顺序问，Claude 问到
#         第 60 题左右预算就用完，收款格子组基本问不到 Claude。max_usd 封顶（默认 9），超了的不问。
#   存放  分数提交到 ops/geo/panel/（公开）。回答原文和别的网站的网址来自付费接口，不进仓库、不进日志：
#         加密后放进草稿 release「geo-panel-state」，密钥用 SELLER_STATE_KEY（和卖家历史库同一把）。
#         解密：gh release download geo-panel-state -p 'panel-<日期>.json.gz.enc' &&
#               openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SELLER_STATE_KEY -in panel-<日期>.json.gz.enc | gunzip
#   子查询 ops/geo/fanout.py：ChatGPT、Perplexity 回答里自带的搜索词（每周），加上每月第一个周一让 Gemini（接口）每题答 1 次拿的搜索词，
#         每条查 Google 前 20，看我们排不排得上；先查 site:jasonzhu.ai 自检，第一条不是本站就写「测不出来」、不查排名
#         再把 4 个品牌词各查 3 次（实体图谱的效果指标）。平时约 $2.5，每月第一个周一会碰到 fanout_usd 封顶（默认 8，填 0 不跑）。计数提交到
#         ops/geo/panel/fanout-<日期>.json，搜索词原文只进邮件和加密存档。这一步失败不挡面板本身。
#   行动清单 ops/geo/fanout_actions.py：不另花钱，读面板和子查询的结果，出四张表进邮件：每道题的公共词（几次回答都用过的词）
#         和题目页面比、页面上缺哪些词；每道题的代表搜索词和它的 Google 名次；AI 搜这些词时 Google 第一页上的外部网站，
#         按能补上几道「我们没排上」的题排（投稿、请求收录先找它们）。页面按 ops/geo/demand.json（Search Console 展示数）排先后。
#         第四张：AI 引用本站时指向的原句（引用链接里的 #:~:text=，主要来自 Gemini App），原句只进邮件。
#         计数提交到 ops/geo/panel/actions-<日期>.json。失败不挡后面。
#   中文检查 ops/geo/zh_check.py：每月第一个周一，真实问法组的中文版问 ChatGPT 3 次、Claude 1 次，看 AI 用什么语言搜、
#         引不引中文页（约 $1.8，zh_usd 封顶）。env 里 ZH_MONTHLY 是 "1" 才跑，11-24 起打开（改成 "0" 就停）；「第一个周一」按北京时间 7 号以内算，第一次是 12-07；计数提交到 ops/geo/panel/zh-<日期>.json。
#   通知  摘要发到 ALERT_EMAIL。失败、或有的 AI 有效回答不到一半（结果不完整），也发邮件。
#   手动  Actions → Run workflow。试跑填 limit=3、publish=0：只问前 3 题，不提交、不存档、不发邮件。
#   改动  改页面前先在 ops/geo/experiments.json 记一笔（改了哪些题的页面、哪些故意不改），周报会按处理组和对照组分开算。
#         两套题的题目都不要改，要加题就加新 id：ops/geo/questions.json 是冻结组，GIGALinks 的实验要在 12-01、12-15、01-01
#         用同一套题复测；ops/geo/questions-real.json 改了题，前后就没法比。
#         ops/geo/questions-gsc.json（Search Console 真题组，17 题）2026-11-24 Jason 确认每周跑，题目同样不要改。
#         ops/geo/questions-grid-payments.json（收款格子组，36 题：场景 × 人群 × 问题）2026-11-25 Jason 确认每周跑，题目同样不要改。
name: GEO 引用面板（每周）

on:
  schedule:
    - cron: "37 3 * * 1"   # 北京周一 11:37；GitHub 定时常晚几小时，这个任务晚了没关系
  workflow_dispatch:
    inputs:
      sets:
        description: "题库，逗号分隔：frozen（冻结组）、real（真实问法组）、gsc（Search Console 真题组）、grid（收款格子组）；留空 = 定时任务用的那套"
        default: ""
      engines:
        description: "引擎:次数，逗号分隔；留空 = 平时那四家各 3 次，每月第一个周一加 claude:1"
        default: ""
      max_usd:
        description: "这次最多花多少美元"
        default: "9"
      limit:
        description: "只问前 N 题（试跑用）；留空 = 全部"
        default: ""
      publish:
        description: "填 0：不提交、不存档、不发邮件（试跑用）"
        default: "1"
      fanout_usd:
        description: "子查询这一步最多花多少美元；填 0 不跑"
        default: "8"
      zh_usd:
        description: "中文检查最多花多少美元（只在每月第一个周一、且 ZH_MONTHLY=1 时跑）；填 0 不跑"
        default: "3"

permissions:
  contents: write

concurrency:
  group: geo-panel
  cancel-in-progress: false

env:
  DEFAULT_SETS: frozen,real,gsc,grid # gsc = Search Console 真题组，2026-11-24 Jason 确认加入（每周约多 $1.4）；grid = 收款格子组，2026-11-25 Jason 确认加入（每周约多 $2）
  ZH_MONTHLY: "1"                    # 每月第一个周一的中文检查，2026-11-24 Jason 确认打开（每月约 $1.8）；改成 "0" 就停
  DEFAULT_ENGINES: chatgpt:3,gemini_app:3,ai_mode:3,perplexity:3

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        # gemini_app 引擎从 backlink-guard 0.12.0 起有
        run: pip install -q "backlink-guard>=0.12,<0.13" markdown requests google-auth

      - name: 自测
        run: python ops/geo/panel_run.py --selftest

      - name: GA4 里来自 AI 的访问（拿不到不挡后面）
        continue-on-error: true
        env:
          GA_ADC_JSON: ${{ secrets.GA_ADC_JSON }}
        run: cd ops/analytics && python fetch_ga.py

      - name: 问一遍、打分
        id: run
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          IN_SETS: ${{ inputs.sets }}
          IN_ENGINES: ${{ inputs.engines }}
          IN_MAX_USD: ${{ inputs.max_usd }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          ENGINES="$IN_ENGINES"
          if [ -z "$ENGINES" ]; then
            ENGINES="$DEFAULT_ENGINES"
            # 每月第一个周一加问 Claude
            [ "$(TZ=Asia/Shanghai date +%-d)" -le 7 ] && ENGINES="$ENGINES,claude:1"
          fi
          ARGS=(--sets "${IN_SETS:-$DEFAULT_SETS}" --engines "$ENGINES" --max-usd "${IN_MAX_USD:-9}" --date "$DAY"
                --full "$RUNNER_TEMP/panel-full.json" --appendix "$RUNNER_TEMP/appendix.md")
          [ -f ops/analytics/out/ga.json ] && ARGS+=(--ga ops/analytics/out/ga.json)
          [ -n "$IN_LIMIT" ] && ARGS+=(--limit "$IN_LIMIT")
          [ "$IN_PUBLISH" = "0" ] && ARGS+=(--dry)
          set +e
          python ops/geo/panel_run.py run "${ARGS[@]}" > "$RUNNER_TEMP/summary.md"
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # 2 = 结果不完整：照样存档、发邮件，最后一步再把这次运行标成失败
          [ "$CODE" = "0" ] || [ "$CODE" = "2" ]

      - name: 子查询：AI 搜了什么、我们排不排得上（失败不挡后面）
        id: fanout
        continue-on-error: true
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          DAY: ${{ steps.run.outputs.day }}
          IN_SETS: ${{ inputs.sets }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_FANOUT_USD: ${{ inputs.fanout_usd }}
        run: |
          USD="${IN_FANOUT_USD:-8}"
          if [ "$USD" = "0" ]; then echo "fanout_usd=0，不跑"; exit 0; fi
          python ops/geo/fanout.py --selftest
          # Gemini 每题约 $0.047，一次约 $2.4：只在每月第一个周一问（和 Claude 加跑同一天）。平时只用面板回答里自带的搜索词
          GEMINI=0
          [ "$(TZ=Asia/Shanghai date +%-d)" -le 7 ] && GEMINI=1
          ARGS=(--sets "${IN_SETS:-$DEFAULT_SETS}" --full "$RUNNER_TEMP/panel-full.json" --max-usd "$USD" --date "$DAY" --gemini "$GEMINI"
                --public "ops/geo/panel/fanout-$DAY.json" --appendix "$RUNNER_TEMP/fanout.md" --archive "$RUNNER_TEMP/fanout-full.json")
          [ -n "$IN_LIMIT" ] && ARGS+=(--limit "$IN_LIMIT")
          [ "$IN_PUBLISH" = "0" ] && ARGS+=(--dry)
          python ops/geo/fanout.py run "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          # 邮件里的附录接在面板附录后面
          [ -f "$RUNNER_TEMP/fanout.md" ] && { echo; cat "$RUNNER_TEMP/fanout.md"; } >> "$RUNNER_TEMP/appendix.md" || true

      - name: 行动清单：改哪页、补哪些词、去哪些站（不花钱，失败不挡后面）
        id: actions
        continue-on-error: true
        env:
          DAY: ${{ steps.run.outputs.day }}
          IN_SETS: ${{ inputs.sets }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          python ops/geo/fanout_actions.py --selftest
          ARGS=(--sets "${IN_SETS:-$DEFAULT_SETS}" --full "$RUNNER_TEMP/panel-full.json" --date "$DAY"
                --public "ops/geo/panel/actions-$DAY.json" --appendix "$RUNNER_TEMP/actions.md")
          [ -f "$RUNNER_TEMP/fanout-full.json" ] && ARGS+=(--archive "$RUNNER_TEMP/fanout-full.json")
          [ -n "$IN_LIMIT" ] && ARGS+=(--limit "$IN_LIMIT")
          [ "$IN_PUBLISH" = "0" ] && ARGS+=(--dry)
          python ops/geo/fanout_actions.py run "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/actions.md" ] && { echo; cat "$RUNNER_TEMP/actions.md"; } >> "$RUNNER_TEMP/appendix.md" || true

      - name: 中文检查（每月第一个周一，ZH_MONTHLY=1 才跑，失败不挡后面）
        id: zh
        continue-on-error: true
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          DAY: ${{ steps.run.outputs.day }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_ZH_USD: ${{ inputs.zh_usd }}
        run: |
          USD="${IN_ZH_USD:-3}"
          if [ "$ZH_MONTHLY" != "1" ] || [ "$USD" = "0" ]; then echo "中文检查没开（ZH_MONTHLY=$ZH_MONTHLY，zh_usd=$USD）"; exit 0; fi
          if [ "$(TZ=Asia/Shanghai date +%-d)" -gt 7 ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then echo "不是每月第一个周一，不跑"; exit 0; fi
          python ops/geo/zh_check.py --selftest
          ARGS=(--max-usd "$USD" --date "$DAY" --public "ops/geo/panel/zh-$DAY.json" --appendix "$RUNNER_TEMP/zh.md"
                --archive "$RUNNER_TEMP/zh-full.json")
          [ -n "$IN_LIMIT" ] && ARGS+=(--limit "$IN_LIMIT")
          [ "$IN_PUBLISH" = "0" ] && ARGS+=(--dry)
          python ops/geo/zh_check.py run "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/zh.md" ] && { echo; cat "$RUNNER_TEMP/zh.md"; } >> "$RUNNER_TEMP/appendix.md" || true

      - name: 提交分数
        if: (inputs.publish || '1') != '0'
        env:
          DAY: ${{ steps.run.outputs.day }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ops/geo/panel/results-$DAY.json" "ops/geo/panel/summary-$DAY.md"
          [ -f "ops/geo/panel/fanout-$DAY.json" ] && git add "ops/geo/panel/fanout-$DAY.json"
          [ -f "ops/geo/panel/actions-$DAY.json" ] && git add "ops/geo/panel/actions-$DAY.json"
          [ -f "ops/geo/panel/zh-$DAY.json" ] && git add "ops/geo/panel/zh-$DAY.json"
          if git diff --cached --quiet; then echo "没有新结果可提交"; exit 0; fi
          git commit -q -m "GEO 引用面板 $DAY"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: 发邮件
        if: (inputs.publish || '1') != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DAY: ${{ steps.run.outputs.day }}
        run: python ops/geo/panel_run.py mail --summary "ops/geo/panel/summary-$DAY.md" --appendix "$RUNNER_TEMP/appendix.md" --to "$ALERT_EMAIL"

      - name: 完整结果加密存档（不进仓库）
        if: (inputs.publish || '1') != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SELLER_STATE_KEY: ${{ secrets.SELLER_STATE_KEY }}
          DAY: ${{ steps.run.outputs.day }}
        run: |
          gh release view geo-panel-state -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create geo-panel-state --draft --title "GEO 面板完整结果（加密）" \
              --notes "ops/geo/panel_run.py 每次运行的完整结果，含回答原文。用 SELLER_STATE_KEY 解密，见 .github/workflows/geo-panel.yml 开头。" \
              -R "$GITHUB_REPOSITORY"
          gzip -c "$RUNNER_TEMP/panel-full.json" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SELLER_STATE_KEY -out "$RUNNER_TEMP/panel-$DAY.json.gz.enc"
          gh release upload geo-panel-state "$RUNNER_TEMP/panel-$DAY.json.gz.enc" --clobber -R "$GITHUB_REPOSITORY"
          if [ -f "$RUNNER_TEMP/fanout-full.json" ]; then
            gzip -c "$RUNNER_TEMP/fanout-full.json" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SELLER_STATE_KEY -out "$RUNNER_TEMP/fanout-$DAY.json.gz.enc"
            gh release upload geo-panel-state "$RUNNER_TEMP/fanout-$DAY.json.gz.enc" --clobber -R "$GITHUB_REPOSITORY"
          fi
          if [ -f "$RUNNER_TEMP/zh-full.json" ]; then
            gzip -c "$RUNNER_TEMP/zh-full.json" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SELLER_STATE_KEY -out "$RUNNER_TEMP/zh-$DAY.json.gz.enc"
            gh release upload geo-panel-state "$RUNNER_TEMP/zh-$DAY.json.gz.enc" --clobber -R "$GITHUB_REPOSITORY"
          fi
          echo "已存档：$(du -h "$RUNNER_TEMP/panel-$DAY.json.gz.enc" | cut -f1)"

      - name: 核对：当天的分数真的进了仓库
        # 11-23 那次定时运行显示成功，提交、邮件、存档三步却全被跳过了。这一步不看运行状态，直接看仓库里有没有当天的文件
        id: landed
        if: (inputs.publish || '1') != '0'
        env:
          DAY: ${{ steps.run.outputs.day }}
        run: |
          git fetch -q origin main
          for f in "results-$DAY.json" "summary-$DAY.md"; do
            if ! git cat-file -e "origin/main:ops/geo/panel/$f" 2>/dev/null; then
              echo "::error::ops/geo/panel/$f 没进仓库"
              exit 1
            fi
          done
          echo "当天的分数已在仓库里：results-$DAY.json、summary-$DAY.md"

      - name: 结果不完整，这次运行算失败
        if: steps.run.outputs.code == '2'
        run: |
          echo "::error::有的 AI 有效回答不到应有的一半，看摘要里「没答出来的」一段"
          exit 1

      - name: 失败告警
        if: failure() && (inputs.publish || '1') != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.run.outputs.code }}
          LANDED: ${{ steps.landed.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          if os.environ.get("LANDED") == "failure":
              why = "跑完了，但当天的分数没进仓库（提交那步被跳过或推送失败）。邮件和存档可能也没做，看运行日志。"
          elif os.environ.get("CODE") == "2":
              why = "结果不完整：有的 AI 有效回答不到应有的一半，摘要已经另发。"
          else:
              why = "工作流中途失败了，这周没有结果。"
          req = urllib.request.Request("https://api.resend.com/emails", method="POST",
              data=json.dumps({"from": "GEO 引用面板 <news@jasonzhu.ai>", "to": [os.environ["ALERT_EMAIL"]], "subject": "GEO 引用面板这周有问题",
                               "html": f"<p>{why}</p><p><a href='{os.environ['RUN_URL']}'>看运行日志</a></p>"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["RESEND_API_KEY"], "Content-Type": "application/json", "User-Agent": "jasonzhu-geo-panel"})
          print(urllib.request.urlopen(req, timeout=30).read().decode())
          PY
