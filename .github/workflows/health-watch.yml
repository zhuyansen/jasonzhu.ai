name: 可用性巡检 (30 分钟)

# 每 30 分钟探测一次全链路可用性（jasonzhu.ai 首页、/api/health DB+KV、AgentSkillsHub 首页+sitemap、
# 各模型通道与余额），用 Upstash KV 做跨次防抖：连续失败 2 次才发故障邮件，恢复时发一封恢复通知。
# 放在 GitHub Actions 跑，不占 Vercel Hobby 的每日定时额度。

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: health-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ops/analytics
    env:
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      FLATROUTER_API_KEY: ${{ secrets.FLATROUTER_API_KEY }}
      FLATROUTER_BASE_URL: ${{ secrets.FLATROUTER_BASE_URL }}
      APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
      APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/analytics/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run 30-min availability watch
        run: python watch_health.py
