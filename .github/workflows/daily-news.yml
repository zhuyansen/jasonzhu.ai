name: Daily AI News Digest

on:
  schedule:
    # 主跑：北京时间 05:30 (UTC 21:30 前一天) — 留足缓冲，确保 8:00 前内容就绪
    - cron: "30 21 * * *"
    # 备跑 1：北京时间 06:30 (UTC 22:30)
    - cron: "30 22 * * *"
    # 备跑 2：北京时间 07:15 (UTC 23:15) — 最后保险，仍早于 8:00
    - cron: "15 23 * * *"
  workflow_dispatch: # 支持手动触发，可指定 date 回填历史
    inputs:
      date:
        description: "回填日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        default: ""
      skip_email:
        description: "填 1 = 只生成快讯、不给订阅者发邮件（比如晚上补跑当天快讯）"
        required: false
        default: ""

permissions:
  contents: write

# GitHub 常把三档 cron 推迟几个小时，排队跑，后一档才看得到前一档提交的快讯
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 今天的快讯已经发出（≥3 条，和 collect-news.mjs 的幂等判断一致）时，定时跑不再采集、重画封面、提交（skip）。
      # 采集脚本自己会跳过，但封面图每次都会重画、被判成「有变化」，以前每档重试都会
      # 多一次提交、多一次 Vercel 部署，再给全体订阅者发一封同样的邮件。
      # 邮件看发信账本（KV 的 digest-email:<日期>，scripts/lib/digest-email-ledger.mjs）：前一档发信失败、只发了一部分、
      # 或发信那步根本没跑到（none），这档补发邮件（retry_email；发信脚本只补没收到的人）。已发完 / 按要求不发：不发。
      # 停在「发送中」（上次发到一半没收尾，不知道发到哪了）：不自动重发，最后一档告警等人处理。
      # 手动跑（date 留空）也看账本：告警之后修好原因、手动跑一次就会补发（采集、封面照旧跑）。
      - name: Check whether today's digest and email are out
        id: done
        if: github.event_name == 'schedule' || inputs.date == ''
        env:
          EVENT: ${{ github.event_name }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          FILE="src/content/news/$(TZ=Asia/Shanghai date +%Y-%m-%d).md"
          if [ -f "$FILE" ] && [ "$(grep -c '^###[[:space:]]' "$FILE")" -ge 3 ]; then
            if [ "$EVENT" = "schedule" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$FILE 已有，这档不再采集、重画封面、提交"
            fi
            # 账本脚本不依赖 npm 包，runner 自带的 node 就能跑；读不到账本打印 unknown（交给发信脚本自己再查一遍）
            EMAIL=$(node scripts/lib/digest-email-ledger.mjs status || echo unknown)
            case "$EMAIL" in
              sent|skipped)
                echo "邮件已经处理完（$EMAIL），不再发" ;;
              sending)
                echo "::warning::上一次发信停在半路没收尾，不自动重发（最后一档会告警）" ;;
              *)
                echo "retry_email=true" >> "$GITHUB_OUTPUT"
                echo "邮件还没发完（账本：$EMAIL），这档补发" ;;
            esac
          fi

      - name: Setup Node.js
        if: steps.done.outputs.skip != 'true' || steps.done.outputs.retry_email == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.done.outputs.skip != 'true' || steps.done.outputs.retry_email == 'true'
        run: npm ci

      - name: Collect and generate news
        if: steps.done.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}  # 调 Claude 专用（只开通 opus-5-5），APIMART_API_KEY 留给生图
          FLATROUTER_API_KEY: ${{ secrets.FLATROUTER_API_KEY }}  # 主力（GPT）。2026-10-24 起不用 aigocode（余额用完，用户决定去掉）
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}  # Jev 融资复核，缺失时跳过
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATE: ${{ inputs.date }}
        run: node scripts/collect-news.mjs

      - name: Generate daily news cover image
        if: steps.done.outputs.skip != 'true'
        continue-on-error: true
        env:
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
        run: node scripts/generate-news-image.mjs ${{ inputs.date }}

      # 融资卡（以及偶尔漏掉的条目）补英文：英文版写进 md 的 frontmatter / 英文行，再重新生成 news.json。
      # 失败不挡发布（中文照常上线、照常发信），下次跑会再补。
      - name: Translate funding cards to English
        if: steps.done.outputs.skip != 'true'
        continue-on-error: true
        env:
          APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}
        run: node scripts/translate-content.mjs news && node scripts/generate-news.mjs

      # 英文封面：按英文标题排版（scripts/fonts 里的开源字体，不走 AI 生图、不花钱，同样的输入出同一张图），英文页 /en/news 用。
      # 放在翻译之后（翻译会补漏掉的英文标题）；失败不挡发布，英文页这期先不放封面。
      - name: Render English news cover
        if: steps.done.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/render-news-cover-en.mjs ${{ inputs.date }} && node scripts/generate-news.mjs

      - name: Check for changes
        if: steps.done.outputs.skip != 'true'
        id: changes
        run: |
          if ! git diff --quiet src/content/news/ src/generated/news.json public/news/; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git ls-files --others --exclude-standard public/news/ src/content/news/ | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/news/ src/generated/news.json public/news/
          DATE_LABEL="${{ inputs.date }}"
          if [ -z "$DATE_LABEL" ]; then DATE_LABEL=$(TZ=Asia/Shanghai date +%Y-%m-%d); fi
          git commit -m "📰 AI 快讯自动采集 ${DATE_LABEL}"
          git push

      # 发信脚本先看账本：今天这期已发完就什么都不做（手动重跑也不会再发一遍）；上次没发完就只补发没收到的人。
      # 还有批次没发出去就以失败退出（这档标红），交给下一档补发。
      - name: Send digest email
        if: inputs.skip_email != '1' && (steps.changes.outputs.changed == 'true' || steps.done.outputs.retry_email == 'true')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}  # 每封邮件的退订链接签名，和 Vercel 上的同一个值；缺了脚本报错、不发
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}  # 发信账本；不通就不发
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/send-digest-email.mjs

      # 手动跑、选了不发邮件：记进账本，免得之后的定时档当成「没发成」给订阅者补发
      - name: Record that this digest is not emailed
        if: inputs.skip_email == '1' && steps.changes.outputs.changed == 'true'
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_DATE: ${{ inputs.date }}  # 留空 = 今天
        run: node scripts/lib/digest-email-ledger.mjs skip "$RUN_DATE"

      # 告警只在最后一档发，避免噪音。不管这档成功、失败还是整轮跳过都检查一遍：
      # 今天的快讯还没生成，或者生成了但邮件没发完（账本不是 sent / skipped），就给 ALERT_EMAIL 发一封。
      - name: Alert if today's digest or email is not out (last retry)
        if: always() && github.event.schedule == '15 23 * * *'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "⚠️ RESEND_API_KEY / ALERT_EMAIL 未设置，跳过告警邮件"
            exit 0
          fi
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          FILE="src/content/news/$DATE.md"
          LOG="<a href='$GH_RUN_URL'>这档的运行日志</a>"
          if [ -f "$FILE" ] && [ "$(grep -c '^###[[:space:]]' "$FILE")" -ge 3 ]; then
            EMAIL=$(node scripts/lib/digest-email-ledger.mjs status || echo unknown)
            case "$EMAIL" in
              sent|skipped) echo "今天的快讯和邮件都处理完了（$EMAIL），不告警"; exit 0 ;;
            esac
            # 账本说明里可能带 Resend 的报错原文，转义后再放进 HTML
            DETAIL=$( (node scripts/lib/digest-email-ledger.mjs summary "$DATE" 2>&1 || echo "账本说明读不出来") |
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
            SUBJECT="⚠️ AI 快讯邮件没发完 ($DATE)"
            HTML="今天的快讯已经发布，但订阅邮件没发完（账本：$EMAIL）。<br><br>$DETAIL<br><br>"
            HTML="$HTML原因修好后，在 Actions 里手动 Run workflow（date 留空）：只补发还没收到的人，同一批用原来的 Idempotency-Key，不会重复发。<br>"
            HTML="$HTML停在 sending（发到一半没收尾）的，要先看日志和 Resend 后台，再用 <code>node --env-file=.env.local scripts/lib/digest-email-ledger.mjs set $DATE sent|failed</code> 改账本。<br>$LOG"
          else
            SUBJECT="⚠️ AI 快讯今天没生成 ($DATE)"
            HTML="三档 cron（北京 05:30 / 06:30 / 07:15，常被 GitHub 推迟几小时）都跑过了，今天的快讯还没生成（这档结果：$JOB_STATUS），请手动检查：<br>$LOG"
          fi
          echo "$SUBJECT"
          jq -n --arg to "$ALERT_EMAIL" --arg subject "$SUBJECT" --arg html "$HTML" \
            '{from: "alerts@jasonzhu.ai", to: [$to], subject: $subject, html: $html}' |
            curl -sS --fail-with-body -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @-
