name: 数据日报

# 每天早上把 jasonzhu.ai 的数据发到邮箱：订阅、文章阅读、GSC、Vercel 流量、GA4 来源/转化、Clarity 体验，
# 再加上自动化管线健康（快讯、提示词库、GitHub 合集、sitemap）。一个源失败不影响其他源，日报照发并在开头标出来。
# 只读：不往 main 推任何东西。
#
# 00:20 UTC = 北京 08:20；GitHub 定时任务常晚 0–40 分钟，实际 8:30–9:00 到。快讯 cron（5:30–7:15）此时已跑完。

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: analytics-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops/analytics
    env:
      GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
      GA_ADC_JSON: ${{ secrets.GA_ADC_JSON }}
      GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      # 模型通道体检用（每条只发 8 token 的探测请求）
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      FLATROUTER_API_KEY: ${{ secrets.FLATROUTER_API_KEY }}
      APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
      APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/analytics/requirements.txt

      - run: pip install -r requirements.txt

      # 文章阅读是累计计数，靠和上次快照做差；快照用 cache 在两次运行之间传递
      - name: Restore snapshots
        uses: actions/cache/restore@v4
        with:
          path: ops/analytics/state
          key: analytics-state-${{ github.run_id }}
          restore-keys: analytics-state-

      - name: Fetch
        run: |
          python fetch_site.py
          python fetch_gsc.py
          python fetch_vercel.py
          python fetch_ga.py
          python fetch_clarity.py
          python fetch_channels.py

      - name: Save snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ops/analytics/state
          key: analytics-state-${{ github.run_id }}

      - name: Build digest
        run: |
          python digest.py > digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python send_email.py digest.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-out-${{ github.run_id }}
          path: ops/analytics/out/*.json
          retention-days: 30
