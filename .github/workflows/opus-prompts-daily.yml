name: 提示词库每日收录（Claude 5.5 + ChatGPT Images 2.6）
# 注意：indexnow.yml 的 workflow_run 按这个 name 挂钩。改 name 要同步改那边，否则收录上线后不推 IndexNow，也不报错。

# 每天北京时间 9:17：收录 24 小时前发布、播放过 5000 的 Opus 5.5 / Sonnet 5.5 新作品，每天最多 80 个（按播放量优先）。
# Claude 分类（被筛掉的由 Jev 复核捞回）并定位提示词 → 代码逐字对账 → Jev 审核 → 拿不准的交 Opus 终审。
# 每次最多处理一天的发布窗口，落后时连跑最多 3 轮自动追上，不需要手动补跑。
# 把握大的直接提交到 main 上线；拿不准的进「滚动 PR」（分支 opus-prompts/pending），合并即批准。
#
# 2026-11-05 起同一次运行接着收 ChatGPT Images 2.6 合集（scripts/image-prompts，流程相同、换成图片 / GIF），两个库一起提交一次，不多一次部署；
# 图片库那步失败不挡 Claude 库上线。它拿不准的作品留在自己的 pending.json，下次运行先交 Opus 终审（没有滚动 PR）。
#
# 需要的 Secrets：AISA_API_KEY（X 数据主通道）和 TWITTERAPI_IO_KEY（AIsa 出错时直连）至少一个，两个都配才有备用；
# JEV_API_KEY（Jev 官方审核）、FLATROUTER_API_KEY（Jev 不可用时的 GPT 备用审核）；Claude 的几个沿用快讯的。
on:
  # 2026-11-09 起由 Vercel Cron 按点触发（vercel.json → /api/cron/prompts）：GitHub 自己的定时常晚 5–7 小时（9:17 → 14:51–15:54）。
  # 下面的 schedule 留着当备用，今天已经收录过就跳过（guard），不会一天跑两轮、多一次提交和部署。
  schedule:
    # 一天一次（北京 9:17）：每次收「24 小时前」为止的帖子，作品最慢 2 天内上线。
    # 2026-10-27 起去掉 21:17 那档：每次提交都触发一次 Vercel 部署，每次部署约 1.4 GB 按月计存储费。
    # 避开整点和半点——原来设 10:30，GitHub 实际拖到 17:00 左右才跑
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      cap:
        description: "本次最多处理多少个作品"
        default: "80"
      window_from:
        description: "补跑：发布时间起点（ISO，如 2026-10-07T00:00Z）；留空 = 正常增量"
        default: ""
      window_to:
        description: "补跑：发布时间终点（ISO）"
        default: ""
      skip_top:
        description: "补跑：按播放量跳过前 N 条（只处理上次被上限截掉的那批）"
        default: ""
      ignore_seen:
        description: "补跑：忽略 seen.json（重跑之前漏掉的时间段时填 1）"
        default: ""
      search_terms:
        description: "补跑：只搜这些词（如 \"Haiku 5.5\" OR \"Haiku5.5\"）；留空 = 全部模型"
        default: ""
      only:
        description: "只跑一个库：claude / images；留空 = 两个都跑（上面的补跑参数只作用于选中的库，两个都跑时只给 Claude 库）"
        default: ""

permissions:
  contents: write
  pull-requests: write

# 和每周核验共用一个组：两边都改 data/candidates.json，串行跑避免互相覆盖
concurrency:
  group: opus-prompts
  cancel-in-progress: false

env:
  DATA: scripts/opus-prompts/data
  OUTPUTS: src/content/opus-prompts src/generated/opus-prompts.json src/generated/opus-prompts-full.json public/data/opus-prompts
  PENDING_BRANCH: opus-prompts/pending
  IMG_DATA: scripts/image-prompts/data
  IMG_OUTPUTS: src/content/image-prompts src/generated/image-prompts.json src/generated/image-prompts-full.json public/data/image-prompts

jobs:
  # 只管 GitHub 自己的定时（备用）：今天（北京）已经正常收录过一次就跳过。
  # 看 main 上最新的 state.json 的 lastRunAt（手动补跑某个时间段不写它，所以补跑不算）。不用 checkout：
  # 排队等前一次跑完时，checkout 拿到的还是排队那一刻的提交，看不到前一次刚提交的 state。
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$DATA/state.json?ref=main" | jq -r '.lastRunAt // empty')
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ -n "$LAST" ] && [ "$(TZ=Asia/Shanghai date -d "$LAST" +%F)" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天（$TODAY）已经收录过（lastRunAt $LAST），这次 GitHub 定时跳过"
          else
            echo "今天还没收录过（lastRunAt ${LAST:-无}），照常跑"
          fi

  collect:
    needs: guard
    # guard 跳过（不是 GitHub 定时）或出错时照常跑：宁可多跑一次，不漏一天
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 采集、判断、审核
        if: inputs.only != 'images'
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}            # X 数据主通道（AIsa，底层就是 twitterapi.io，同价）
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}  # X 数据备用：AIsa 出错时直连
          FLATROUTER_API_KEY: ${{ secrets.FLATROUTER_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}  # Jev 官方（优先）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}  # 调 Claude 专用（只开通 opus-5-5），APIMART_API_KEY 留给生图
          CAP: ${{ inputs.cap || '80' }}
          WINDOW_FROM: ${{ inputs.window_from }}
          WINDOW_TO: ${{ inputs.window_to }}
          SEARCH_TERMS: ${{ inputs.search_terms }}
          IGNORE_SEEN: ${{ inputs.ignore_seen }}
          SKIP_TOP: ${{ inputs.skip_top }}
        run: |
          if [ -z "$AISA_API_KEY" ] && [ -z "$TWITTERAPI_IO_KEY" ]; then
            echo "::error::AISA_API_KEY 和 TWITTERAPI_IO_KEY 都没配，无法搜索新帖"
            exit 1
          fi
          if [ -z "$AISA_API_KEY" ]; then echo "::warning::没配 AISA_API_KEY：X 数据只走 twitterapi.io 直连"; fi
          if [ -z "$TWITTERAPI_IO_KEY" ]; then echo "::warning::没配 TWITTERAPI_IO_KEY：AIsa 出错时没有备用通道"; fi
          if [ -z "$JEV_API_KEY" ]; then
            echo "::warning::没配 JEV_API_KEY：审核会退回到 GPT（flatrouter），Jev 不会启用"
          fi
          # 每次最多处理一天的窗口；落后时连跑，逐天追上（最多 3 轮）
          set -o pipefail  # 否则 tee 会吞掉 daily.mjs 的失败
          # 指定了补跑窗口就只跑一轮（daily.mjs 不读写 state 的窗口进度）
          if [ -n "$WINDOW_FROM" ]; then ROUNDS=1; else ROUNDS="1 2 3"; fi
          for i in $ROUNDS; do
            node scripts/opus-prompts/daily.mjs | tee "$RUNNER_TEMP/daily-$i.log"
            if grep -q "CAUGHT_UP" "$RUNNER_TEMP/daily-$i.log"; then break; fi
          done

      - name: ChatGPT Images 2.6 合集：采集、判断、审核
        if: inputs.only != 'claude'
        continue-on-error: true  # 新库出问题不挡 Claude 库上线
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          FLATROUTER_API_KEY: ${{ secrets.FLATROUTER_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}
          CAP: ${{ inputs.cap || '80' }}
          # 补跑参数只在 only=images 时给图片库（否则会拿 Claude 的搜索词去搜图片）
          WINDOW_FROM: ${{ inputs.only == 'images' && inputs.window_from || '' }}
          WINDOW_TO: ${{ inputs.only == 'images' && inputs.window_to || '' }}
          SEARCH_TERMS: ${{ inputs.only == 'images' && inputs.search_terms || '' }}
          IGNORE_SEEN: ${{ inputs.only == 'images' && inputs.ignore_seen || '' }}
          SKIP_TOP: ${{ inputs.only == 'images' && inputs.skip_top || '' }}
        run: |
          set -o pipefail
          if [ -n "$WINDOW_FROM" ]; then ROUNDS=1; else ROUNDS="1 2 3"; fi
          for i in $ROUNDS; do
            node scripts/image-prompts/daily.mjs | tee "$RUNNER_TEMP/images-$i.log"
            if grep -q "CAUGHT_UP" "$RUNNER_TEMP/images-$i.log"; then break; fi
          done

      - name: 组装并编译
        run: |
          if [ "${{ inputs.only }}" != "images" ]; then
            node scripts/opus-prompts/assemble.mjs --write
            node scripts/generate-opus-prompts.mjs
          fi
          if [ "${{ inputs.only }}" != "claude" ]; then
            node scripts/image-prompts/assemble.mjs --write && node scripts/generate-image-prompts.mjs || echo "::warning::ChatGPT Images 2.6 合集组装失败，这次不更新它"
          fi

      - name: 上线（提交到 main）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $DATA $OUTPUTS $IMG_DATA $IMG_OUTPUTS
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "✨ 提示词库每日收录 $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: 滚动 PR（拿不准的作品）
        if: inputs.only != 'images'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).length)' "$DATA/pending.json")
          PR=$(gh pr list --head "$PENDING_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ "$COUNT" = "0" ]; then
            if [ -n "$PR" ]; then gh pr close "$PR" --delete-branch --comment "待审队列已清空。"; fi
            echo "待审队列为空"
            exit 0
          fi
          # 每天从最新的 main 重建分支，所以不会和 main 产生冲突
          git checkout -B "$PENDING_BRANCH"
          node scripts/opus-prompts/apply-pending.mjs --body "$RUNNER_TEMP/pr-body.md" --apply
          node scripts/opus-prompts/assemble.mjs --write
          node scripts/generate-opus-prompts.mjs
          git add $DATA $OUTPUTS
          git commit -m "待审核的新作品（$COUNT 个）"
          git push --force origin "$PENDING_BRANCH"
          TITLE="提示词库：待审核的新作品（$COUNT 个）"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$PENDING_BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
