name: Claude 5.5 提示词库每日收录

# 每天北京时间 10:30：收录 24 小时前发布、播放过 5000 的 Opus 5.5 / Sonnet 5.5 新作品，每天最多 80 个（按播放量优先）。
# Claude 分类（被筛掉的由 Jev 复核捞回）并定位提示词 → 代码逐字对账 → Jev 审核 → 拿不准的交 Opus 终审。
# 每次最多处理一天的发布窗口，落后时连跑最多 3 轮自动追上，不需要手动补跑。
# 把握大的直接提交到 main 上线；拿不准的进「滚动 PR」（分支 opus-prompts/pending），合并即批准。
#
# 需要的 Secrets：TWITTERAPI_IO_KEY（必需）、OPENROUTER_API_KEY（Jev 审核）、FLATROUTER_API_KEY（Jev 不可用时的 GPT 备用审核）；Claude 的几个沿用快讯的。
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      cap:
        description: "本次最多处理多少个作品"
        default: "80"
      window_from:
        description: "补跑：发布时间起点（ISO，如 2026-10-07T00:00Z）；留空 = 正常增量"
        default: ""
      window_to:
        description: "补跑：发布时间终点（ISO）"
        default: ""
      search_terms:
        description: "补跑：只搜这些词（如 \"Haiku 5.5\" OR \"Haiku5.5\"）；留空 = 全部模型"
        default: ""

permissions:
  contents: write
  pull-requests: write

# 和每周核验共用一个组：两边都改 data/candidates.json，串行跑避免互相覆盖
concurrency:
  group: opus-prompts
  cancel-in-progress: false

env:
  DATA: scripts/opus-prompts/data
  OUTPUTS: src/content/opus-prompts src/generated/opus-prompts.json src/generated/opus-prompts-full.json public/data/opus-prompts
  PENDING_BRANCH: opus-prompts/pending

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 采集、判断、审核
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          FLATROUTER_API_KEY: ${{ secrets.FLATROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: "https://api.aigocode.app"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          APIMART_CLAUDE_KEY: ${{ secrets.APIMART_CLAUDE_KEY }}  # 调 Claude 专用（只开通 opus-5-5），APIMART_API_KEY 留给生图
          CAP: ${{ inputs.cap || '80' }}
          WINDOW_FROM: ${{ inputs.window_from }}
          WINDOW_TO: ${{ inputs.window_to }}
          SEARCH_TERMS: ${{ inputs.search_terms }}
        run: |
          if [ -z "$TWITTERAPI_IO_KEY" ]; then
            echo "::error::缺少 Secret TWITTERAPI_IO_KEY，无法搜索新帖"
            exit 1
          fi
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::没配 OPENROUTER_API_KEY：审核会退回到 GPT（flatrouter），Jev 不会启用"
          fi
          # 每次最多处理一天的窗口；落后时连跑，逐天追上（最多 3 轮）
          set -o pipefail  # 否则 tee 会吞掉 daily.mjs 的失败
          # 指定了补跑窗口就只跑一轮（daily.mjs 不读写 state 的窗口进度）
          if [ -n "$WINDOW_FROM" ]; then ROUNDS=1; else ROUNDS="1 2 3"; fi
          for i in $ROUNDS; do
            node scripts/opus-prompts/daily.mjs | tee "$RUNNER_TEMP/daily-$i.log"
            if grep -q "CAUGHT_UP" "$RUNNER_TEMP/daily-$i.log"; then break; fi
          done

      - name: 组装并编译
        run: |
          node scripts/opus-prompts/assemble.mjs --write
          node scripts/generate-opus-prompts.mjs

      - name: 上线（提交到 main）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $DATA $OUTPUTS
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "✨ 提示词库每日收录 $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: 滚动 PR（拿不准的作品）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).length)' "$DATA/pending.json")
          PR=$(gh pr list --head "$PENDING_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ "$COUNT" = "0" ]; then
            if [ -n "$PR" ]; then gh pr close "$PR" --delete-branch --comment "待审队列已清空。"; fi
            echo "待审队列为空"
            exit 0
          fi
          # 每天从最新的 main 重建分支，所以不会和 main 产生冲突
          git checkout -B "$PENDING_BRANCH"
          node scripts/opus-prompts/apply-pending.mjs --body "$RUNNER_TEMP/pr-body.md" --apply
          node scripts/opus-prompts/assemble.mjs --write
          node scripts/generate-opus-prompts.mjs
          git add $DATA $OUTPUTS
          git commit -m "待审核的新作品（$COUNT 个）"
          git push --force origin "$PENDING_BRANCH"
          TITLE="提示词库：待审核的新作品（$COUNT 个）"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$PENDING_BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
